name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check winduo tests

      - name: Test
        # The suite needs no camera, no display, and no lid, which is the whole
        # reason the estimator takes readings as arguments.
        run: pytest

  imports:
    # Catches the mistakes a headless test run cannot: a Qt or OpenGL module
    # that fails to import at all.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Import every module
        run: |
          python -c "import importlib, pkgutil, winduo; [importlib.import_module(m.name) for m in pkgutil.walk_packages(winduo.__path__, 'winduo.')]"
      - name: Version check
        run: python -m winduo --version
